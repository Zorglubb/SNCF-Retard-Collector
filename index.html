<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNCF Achievements</title>
    <style>
        :root {
            --sncf-blue: #002244;
            --sncf-purple: #8A2571;
            --sncf-accent: #CD004D;
            --bg-color: #F4F4F9;
            --card-bg: #FFFFFF;
            --text-color: #333333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        header {
            background: linear-gradient(135deg, var(--sncf-blue), var(--sncf-purple));
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 25px;
        }

        header h1 { margin: 0; font-size: 1.6rem; }
        header p { margin: 5px 0 0 0; opacity: 0.9; font-size: 0.9rem; }

        .time-counter {
            background: #fffae6;
            border: 2px dashed #ffcc00;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            margin-bottom: 20px;
            color: #cc9900;
        }

        .time-display {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--sncf-accent);
            margin-top: 5px;
        }

        .section-title {
            font-size: 1.2rem;
            color: var(--sncf-blue);
            border-bottom: 2px solid var(--sncf-purple);
            padding-bottom: 5px;
            margin-top: 30px;
        }

        .stats-container {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .stat-line {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }
        .stat-line:last-child { border-bottom: none; }
        
        .badge-count {
            background-color: var(--sncf-accent);
            color: white;
            padding: 2px 10px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        /* Formulaire masqué par défaut, visible uniquement en mode édition */
        .custom-form {
            display: none;
            background: #fff0f5;
            border: 2px dashed var(--sncf-purple);
            padding: 15px;
            border-radius: 12px;
            margin-top: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            gap: 10px;
            flex-direction: column;
        }

        .custom-form input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
        }

        .custom-form button {
            background-color: var(--sncf-purple);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-top: 15px;
        }

        @media(min-width: 600px) { .grid { grid-template-columns: 1fr 1fr; } }

        .card {
            background: var(--card-bg);
            border-left: 5px solid var(--sncf-purple);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s;
        }

        .card-content { flex-grow: 1; padding-right: 10px; }
        .card-title { font-weight: bold; font-size: 1rem; margin-bottom: 4px; }
        .card-desc { font-size: 0.85rem; color: #666; }

        .actions {
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .btn-action {
            color: white;
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .btn-add { background-color: var(--sncf-blue); }
        .btn-add:active { background-color: var(--sncf-accent); }
        .btn-remove { background-color: #bbb; font-size: 1rem; }
        .btn-remove:active { background-color: #777; }
        
        /* Bouton poubelle rouge */
        .btn-delete {
            background-color: #dc3545;
            font-size: 1rem;
            display: none; /* Masqué par défaut */
        }

        .bottom-controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 40px;
            align-items: center;
        }

        .mode-btn {
            background-color: var(--sncf-blue);
            color: white;
            border: none;
            padding: 12px 20px;
